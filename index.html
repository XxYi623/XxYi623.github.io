<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾宾浩斯复习助手</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
  <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">艾宾浩斯复习助手</h1>
  <div class="mb-4">
    <h2 class="text-lg font-semibold">积分：<span id="score">0</span></h2>
  </div>
  <div class="space-y-3">
    <div class="flex gap-2">
      <input id="wordInput" type="text" placeholder="输入要记忆的内容" class="flex-1 border rounded px-3 py-2">
      <button onclick="addItem()" class="bg-blue-500 text-white px-4 py-2 rounded">添加</button>
    </div>
    <div>
      <h3 class="font-medium mb-2">今日待复习</h3>
      <div id="todayList" class="space-y-2"></div>
    </div>
  </div>
</div>
<script>
let data = JSON.parse(localStorage.getItem('reviewData')) || {list:[],score:0};
document.getElementById('score').innerText = data.score;
function save(){
  localStorage.setItem('reviewData',JSON.stringify(data));
}
function addItem(){
  const text = document.getElementById('wordInput').value.trim();
  if(!text)return;
  const now = Date.now();
  data.list.push({text,created:now,next:now,stage:0});
  data.score +=10;
  save();render();
  document.getElementById('wordInput').value="";
}
function reviewDone(idx){
  const item = data.list[idx];
  const gap = [1*60*1000,10*60*1000,60*60*1000,24*60*60*1000,2*24*60*60*1000,7*24*60*60*1000];
  item.stage = Math.min(item.stage+1,gap.length-1);
  item.next = Date.now()+gap[item.stage];
  data.score +=5;
  save();render();
}
function render(){
  document.getElementById('score').innerText=data.score;
  const container = document.getElementById('todayList');
  container.innerHTML="";
  const now = Date.now();
  const today = data.list.filter(x=>x.next <= now);
  today.forEach((item,i)=>{
    const realIdx = data.list.indexOf(item);
    const div = document.createElement('div');
    div.className="border p-2 rounded flex justify-between items-center";
    div.innerHTML = `<span>${item.text}</span><button onclick="reviewDone(${realIdx})" class="bg-green-500 text-white px-3 py-1 rounded">复习完成</button>`;
    container.appendChild(div);
  })
}
render();
</script>
</body>
</html>
