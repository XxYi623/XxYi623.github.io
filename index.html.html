<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>艾宾浩斯复习助手 | 积分激励版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>
  <style>
    .card-shadow {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .circle-progress {
      transform: rotate(-90deg);
    }
    @keyframes popScore {
      0% { transform: scale(1); opacity:1; }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); opacity:1;}
    }
    .score-pop{
      animation: popScore 0.4s ease;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 min-h-screen transition-colors duration-300">
<div class="max-w-3xl mx-auto px-4 py-8">
  <!-- 头部 -->
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-800 dark:text-white">艾宾浩斯复习计划</h1>
    <button id="toggleDark" class="px-3 py-2 rounded-lg bg-gray-200 dark:bg-slate-700 dark:text-white">
      🌓 切换深色
    </button>
  </header>

  <!-- ========== 积分面板 ========== -->
  <div class="bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-900/40 dark:to-orange-900/40 rounded-xl p-5 card-shadow mb-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-100">🏅 积分激励</h2>
    <div class="grid grid-cols-3 gap-4 text-center">
      <div class="bg-white/70 dark:bg-slate-800/60 rounded-lg p-3">
        <div id="scoreNum" class="text-2xl font-bold text-orange-500">0</div>
        <div class="text-xs text-gray-500 dark:text-gray-300">总积分</div>
      </div>
      <div class="bg-white/70 dark:bg-slate-800/60 rounded-lg p-3">
        <div id="streakDay" class="text-2xl font-bold text-rose-500">0</div>
        <div class="text-xs text-gray-500 dark:text-gray-300">连续打卡</div>
      </div>
      <div class="bg-white/70 dark:bg-slate-800/60 rounded-lg p-3">
        <div id="maxStreak" class="text-2xl font-bold text-blue-500">0</div>
        <div class="text-xs text-gray-500 dark:text-gray-300">最高连续</div>
      </div>
    </div>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-300">规则：完成单次复习 +10积分；完成今日全部任务额外+30积分</p>
  </div>

  <!-- ========== 仪表盘统计区域 ========== -->
  <div class="bg-white dark:bg-slate-800 rounded-xl p-5 card-shadow mb-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-100">📊 复习仪表盘</h2>
    <div class="grid grid-cols-2 gap-4">
      <!-- 环形进度 -->
      <div class="flex justify-center items-center relative h-[120px]">
        <svg width="120" height="120" class="circle-progress">
          <circle cx="60" cy="60" r="50" stroke="#e5e7eb" stroke-width="8" fill="none" class="dark:stroke-slate-700"/>
          <circle id="progressCircle" cx="60" cy="60" r="50" stroke="#3b82f6" stroke-width="8" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="absolute text-center">
          <div id="rateText" class="text-xl font-bold text-gray-800 dark:text-white">0%</div>
          <div class="text-xs text-gray-500 dark:text-gray-400">总完成率</div>
        </div>
      </div>
      <!-- 统计数字卡片 -->
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-300">总条目：</span>
          <span id="totalCount" class="font-semibold text-gray-800 dark:text-white">0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-300">进行中：</span>
          <span id="ongoingCount" class="font-semibold text-blue-600 dark:text-blue-400">0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-300">全部完成：</span>
          <span id="finishedCount" class="font-semibold text-green-600 dark:text-green-400">0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-300">今日待复习：</span>
          <span id="todayNeed" class="font-semibold text-orange-600 dark:text-orange-400">0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600 dark:text-gray-300">今日已完成：</span>
          <span id="todayDone" class="font-semibold text-green-600 dark:text-green-400">0</span>
        </div>
      </div>
    </div>
    <!-- 进度条 -->
    <div class="mt-4">
      <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-2.5">
        <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- 添加新条目 -->
  <div class="bg-white dark:bg-slate-800 rounded-xl p-5 card-shadow mb-6">
    <h2 class="text-lg font-semibold mb-3 text-gray-700 dark:text-gray-100">添加新学习内容</h2>
    <div class="flex gap-2">
      <input id="inputTitle" type="text" placeholder="输入单词/知识点/笔记名称"
             class="flex-1 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400">
      <button id="btnAdd" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">添加</button>
    </div>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">默认复习周期：第1、2、4、7、15、30天</p>
  </div>

  <!-- ========== 板块1：今日复习 ========== -->
  <div class="bg-white dark:bg-slate-800 rounded-xl p-5 card-shadow mb-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-100">📅 今日复习任务</h2>
    <div id="todayBlock"></div>
  </div>

  <!-- ========== 板块2：所有条目学习进度 ========== -->
  <div class="bg-white dark:bg-slate-800 rounded-xl p-5 card-shadow mb-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-100">📈 全部学习进度</h2>
    <div id="progressBlock"></div>
  </div>

</div>

<script>
// 复习间隔（可自行修改）
const intervals = [1,2,4,7,15,30];
const STORAGE_KEY = 'ebbinghaus-data';
const SCORE_KEY = 'ebbinghaus-score';

// 读取复习数据
function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveData(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

// 积分、打卡数据
function loadScoreInfo(){
  const raw = localStorage.getItem(SCORE_KEY);
  const defaultInfo = {
    score: 0,
    streak: 0,
    maxStreak:0,
    lastReviewDate: ""
  }
  return raw ? {...defaultInfo, ...JSON.parse(raw)} : defaultInfo;
}
function saveScoreInfo(info){
  localStorage.setItem(SCORE_KEY, JSON.stringify(info));
}

// 获取日期字符串 YYYY-MM-DD
function getDayStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 增加天数
function addDays(dateStr, days){
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return getDayStr(d);
}

// 添加新项目
function addItem(title){
  if(!title.trim()) return;
  const list = loadData();
  const today = getDayStr(new Date());
  const plans = intervals.map(dayOffset => {
    return {
      reviewDate: addDays(today, dayOffset),
      done: false
    }
  });
  const newItem = {
    id: Date.now(),
    title: title.trim(),
    createDate: today,
    plans,
    finished: false
  };
  list.push(newItem);
  saveData(list);
  renderAll();
}

// 标记复习完成 + 积分逻辑
function markPlanDone(itemId, planIdx){
  const list = loadData();
  const item = list.find(i=>i.id===itemId);
  if(!item) return;
  const plan = item.plans[planIdx];
  if(plan.done) return; // 已经完成，不再重复加分

  plan.done = true;
  item.finished = item.plans.every(p=>p.done);
  saveData(list);

  const today = getDayStr(new Date());
  const scoreInfo = loadScoreInfo();

  // 单次复习 +10分
  scoreInfo.score += 10;

  // 判断今日所有任务是否全部完成
  const todayAllPlans = list.flatMap(it=>it.plans.filter(p=>p.reviewDate===today));
  const allTodayDone = todayAllPlans.every(p=>p.done);

  // 打卡连续天数
  if(scoreInfo.lastReviewDate === getDayStr(new Date(new Date().setDate(new Date().getDate()-1)))){
    // 昨天完成，连续+1
    scoreInfo.streak +=1;
  }else if(scoreInfo.lastReviewDate !== today){
    // 断签，重置为1
    scoreInfo.streak = 1;
  }
  scoreInfo.lastReviewDate = today;
  if(scoreInfo.streak > scoreInfo.maxStreak){
    scoreInfo.maxStreak = scoreInfo.streak;
  }

  // 全部今日任务完成，额外奖励30
  if(allTodayDone){
    scoreInfo.score +=30;
    alert("🎉恭喜！今日全部复习完成，额外+30积分！");
  }

  saveScoreInfo(scoreInfo);
  renderAll();
}

// 删除条目
function deleteItem(id){
  let list = loadData();
  list = list.filter(i=>i.id!==id);
  saveData(list);
  renderAll();
}

// ========== 板块1：渲染今日复习卡片 ==========
function renderTodayItems(list){
  const today = getDayStr(new Date());
  let html = '';
  const todayItems = list.filter(item=> item.plans.some(p=>p.reviewDate === today && !p.done));
  if(todayItems.length ===0){
    html = '<p class="text-gray-500 dark:text-gray-400">🎉今日没有复习任务</p>';
    return html;
  }
  todayItems.forEach(item=>{
    html += `
    <div class="border border-gray-200 dark:border-slate-700 rounded-lg p-3 mb-3">
      <div class="flex justify-between items-center">
        <h3 class="font-medium text-gray-800 dark:text-white">${item.title}</h3>
        <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-600 text-sm">删除</button>
      </div>
      <div class="mt-2 flex flex-wrap gap-2">
    `;
    item.plans.forEach((plan, idx)=>{
      const isToday = plan.reviewDate === today;
      if(isToday && !plan.done){
        html += `<button onclick="markPlanDone(${item.id},${idx})" class="px-2 py-1 rounded text-sm bg-orange-100 dark:bg-orange-900 text-orange-700 dark:text-orange-200">🔔 点击完成 ${plan.reviewDate}</button>`;
      }
    })
    html += '</div></div>';
  })
  return html;
}

// ========== 板块2：渲染单条学习进度（带独立进度条） ==========
function renderAllProgressItems(list){
  const today = getDayStr(new Date());
  let html = '';
  if(list.length ===0){
    html = '<p class="text-gray-500 dark:text-gray-400">暂无学习条目，请添加内容</p>';
    return html;
  }
  list.forEach(item=>{
    const total = item.plans.length;
    const doneCount = item.plans.filter(p=>p.done).length;
    const itemPercent = Math.round(doneCount / total *100);

    html += `
    <div class="border border-gray-200 dark:border-slate-700 rounded-lg p-3 mb-4">
      <div class="flex justify-between items-center">
        <h3 class="font-medium text-gray-800 dark:text-white">${item.title}</h3>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-500 dark:text-gray-400">${doneCount}/${total} ${itemPercent}%</span>
          <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-600 text-sm">删除</button>
        </div>
      </div>
      <!-- 单条进度条 -->
      <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-2 mt-2">
        <div class="bg-green-500 h-2 rounded-full transition-all duration-300" style="width:${itemPercent}%"></div>
      </div>
      <!-- 复习节点标记 -->
      <div class="mt-2 flex flex-wrap gap-2">
    `;
    item.plans.forEach((plan, idx)=>{
      const isToday = plan.reviewDate === today;
      const past = plan.reviewDate < today;
      let cls = 'px-2 py-1 rounded text-sm';
      if(plan.done){
        cls += ' bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-200';
        html += `<span ${cls}>✓${plan.reviewDate}</span>`;
      }else if(isToday){
        cls += ' bg-orange-100 dark:bg-orange-900 text-orange-700 dark:text-orange-200';
        html += `<button onclick="markPlanDone(${item.id},${idx})" ${cls}>🔔${plan.reviewDate}</button>`;
      }else if(past){
        cls += ' bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200';
        html += `<span ${cls}>⏰${plan.reviewDate}</span>`;
      }else{
        cls += ' bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300';
        html += `<span ${cls}>📅${plan.reviewDate}</span>`;
      }
    })
    html += '</div></div>';
  })
  return html;
}

// ========== 统计仪表盘计算 ==========
function calcStats(list){
  const today = getDayStr(new Date());
  let totalPlans = 0;
  let donePlans = 0;
  let todayNeed = 0;
  let todayDone = 0;
  let finishedCount = 0;

  list.forEach(item=>{
    if(item.finished) finishedCount++;
    item.plans.forEach(p=>{
      totalPlans++;
      if(p.done) donePlans++;
      if(p.reviewDate === today){
        if(p.done) todayDone++;
        else todayNeed++;
      }
    })
  })
  const totalItems = list.length;
  const ongoingCount = totalItems - finishedCount;
  const rate = totalPlans === 0 ? 0 : Math.round(donePlans / totalPlans * 100);
  return {
    totalItems, ongoingCount, finishedCount,
    todayNeed, todayDone, rate
  }
}

// 更新仪表盘UI
function renderDashboard(list){
  const s = calcStats(list);
  document.getElementById('totalCount').innerText = s.totalItems;
  document.getElementById('ongoingCount').innerText = s.ongoingCount;
  document.getElementById('finishedCount').innerText = s.finishedCount;
  document.getElementById('todayNeed').innerText = s.todayNeed;
  document.getElementById('todayDone').innerText = s.todayDone;
  document.getElementById('rateText').innerText = `${s.rate}%`;
  document.getElementById('progressBar').style.width = `${s.rate}%`;

  // SVG环形进度
  const circle = document.getElementById('progressCircle');
  const r = 50;
  const circumference = 2 * Math.PI * r;
  circle.style.strokeDasharray = `${circumference}`;
  circle.style.strokeDashoffset = `${circumference * (1 - s.rate / 100)}`;
}

// 更新积分面板
function renderScorePanel(){
  const info = loadScoreInfo();
  document.getElementById("scoreNum").textContent = info.score;
  document.getElementById("streakDay").textContent = info.streak;
  document.getElementById("maxStreak").textContent = info.maxStreak;
}

// 主渲染入口
function renderAll(){
  const list = loadData();
  renderDashboard(list);
  renderScorePanel();
  document.getElementById('todayBlock').innerHTML = renderTodayItems(list);
  document.getElementById('progressBlock').innerHTML = renderAllProgressItems(list);
}

// 添加按钮
document.getElementById('btnAdd').onclick = ()=>{
  const val = document.getElementById('inputTitle').value;
  addItem(val);
  document.getElementById('inputTitle').value = '';
}
document.getElementById('inputTitle').onkeydown = e=>{
  if(e.key === 'Enter'){
    document.getElementById('btnAdd').click();
  }
}

// 深色模式
const toggleDark = document.getElementById('toggleDark');
toggleDark.onclick = ()=>{
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('dark', document.documentElement.classList.contains('dark'));
}
if(localStorage.getItem('dark') === 'true'){
  document.documentElement.classList.add('dark');
}

// 全局暴露函数
window.markPlanDone = markPlanDone;
window.deleteItem = deleteItem;

renderAll();
</script>
</body>
</html>
